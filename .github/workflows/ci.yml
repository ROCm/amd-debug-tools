name: CI
on:
  push:
  pull_request:
  workflow_run:
    workflows: ["mirror"]
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: debian:unstable
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts equivs fakeroot
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Debian packaging
        run: |
          git clone --depth 1 --branch debian \
            https://salsa.debian.org/debian/amd-debug-tools.git /tmp/salsa
          rm -rf debian
          cp -a /tmp/salsa/debian debian
      - name: Install build dependencies
        run: mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Set version from git describe
        run: |
          git config --global --add safe.directory "$PWD"
          # e.g. v0.2.22-35-gd87a729 -> 0.2.22-35-gd87a729-0
          desc=$(git describe --tags | sed 's/^v//') \
            || desc=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          export DEBFULLNAME="CI" DEBEMAIL="ci@localhost"
          dch --force-bad-version --newversion "${desc}-0" \
            --distribution unstable "Automated CI build of ${desc}"
          # setuptools-scm needs a PEP 440 version
          scm=$(echo "$desc" | sed -E 's/^([0-9.]+)-([0-9]+)-g([0-9a-f]+)$/\1.post\2+g\3/')
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$scm" >> "$GITHUB_ENV"
      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b
      - name: Collect packages
        run: |
          mkdir -p deb-out
          mv ../*.deb deb-out/
      - name: Store the Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: deb-out/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/amd-debug-tools
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    - build-deb
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Download the Debian package
      uses: actions/download-artifact@v4
      with:
        name: debian-package
        path: deb/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
          ./deb/*.deb
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "$GITHUB_REF_NAME" dist/** deb/**
        --repo "$GITHUB_REPOSITORY"

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: install apt deps
      run: |
        sudo apt update
        sudo apt install libsystemd-dev -y
    - name: install deps
      run: |
        pip install .
    - name: Generate Report
      run: |
        pip install pytest-cov
        pytest --cov --junitxml=junit.xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
